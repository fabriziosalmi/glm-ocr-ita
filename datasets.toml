# The role of every page set (rule 2 of docs/ROADMAP.md). Names resolve as in glmocr/corpus.py:
# inside the repository, then under $GLMOCR_DATASETS (default ~/Documents/git/datasets).
#   train  the only pages weights or calibration statistics may see
#   dev    for choosing between configurations
#   test   read once per decision; `glmocr run` refuses until the tag is written in docs/LEDGER.md
#   spent  a former test set, kept as a regression check: it decides nothing
# Why each set has its role: docs/DATASETS.md.

# The handwritten amounts of make_hard.py are drawn on the page and listed as entities, but are not in the .txt:
# they count for entity recall and are invisible to CER and to the skipped-block count.
[dataset."hard"]
role = "dev"
accept = ["handwritten entity not in the ground truth"]
[dataset."held"]
role = "spent"
accept = ["handwritten entity not in the ground truth"]

